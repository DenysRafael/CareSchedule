<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Agendamento - Sistema de Agendamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrapper">
    <header class="header">
        <h1>Sistema de Agendamento</h1>
        <div class="header-right">
            <span id="emailUsuario"></span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </header>

    <main class="main-content">
        <div class="section-header">
            <h2>Novo Agendamento</h2>
            <a href="agendamentos.html" class="btn-voltar">← Voltar</a>
        </div>

        <div class="card form-agendamento">
            <div class="form-group">
                <label for="tipoConsulta">Tipo de consulta</label>
                <select id="tipoConsulta">
                    <option value="PRIMEIRA_CONSULTA">Primeira consulta</option>
                    <option value="RETORNO">Retorno</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data">Data</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group">
                <label for="horario">Horário</label>
                <select id="horario">
                    <option value="">Selecione uma data primeiro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="discricao">Descrição (opcional)</label>
                <textarea id="discricao" placeholder="Descreva brevemente o motivo da consulta..." rows="3"></textarea>
            </div>

            <div id="mensagem" class="mensagem" style="display: none;"></div>

            <button class="btn-primary" onclick="agendar()">Confirmar agendamento</button>
        </div>
    </main>
</div>
<script src="js/novo-agendamento.js"></script>
</body>
</html>
