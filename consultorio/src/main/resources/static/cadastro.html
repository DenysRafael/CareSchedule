<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cadastro - Sistema de Agendamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Sistema de Agendamento</h1>
            <p>Crie sua conta para agendar consultas</p>
        </div>

        <form id="formCadastro">
            <div class="form-group">
                <label for="fullName">Nome Completo</label>
                <input type="text" id="fullName" placeholder="Seu nome completo" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input type="text" id="phone" placeholder="(00) 00000-0000" maxlength="15" required>
                </div>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div id="mensagem" class="mensagem" style="display: none;"></div>

            <button type="submit" class="btn-primary">Criar conta</button>

            <p class="link-login">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
    </div>
</div>
<script src="js/cadastro.js"></script>
</body>
</html>
