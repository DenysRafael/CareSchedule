<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login - Sistema de Agendamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Sistema de Agendamento</h1>
            <p>Entre na sua conta para agendar consultas</p>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <div id="mensagem" class="mensagem" style="display: none;"></div>

            <button type="submit" class="btn-primary">Entrar</button>

            <p class="link-login">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
